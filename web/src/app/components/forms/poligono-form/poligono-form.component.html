<section class="form-page">
  <div class="form-header">
    <div>
      <p class="eyebrow">Capa vectorial</p>
      <h2>Formulario campus_poligonos</h2>
      <p>Administra edificios, áreas y superficies del campus.</p>
    </div>
  </div>

  <mat-card class="form-card">
    <mat-card-content>
      <form [formGroup]="controlsGroup">
        <p class="helper-text">
          El campo <strong>id</strong> solo es obligatorio para selectone, update y delete.
        </p>

        <div class="form-grid">
          <mat-form-field>
            <input matInput id="id" name="id" placeholder="id" [formControl]="id">
          </mat-form-field>

          <mat-form-field>
            <input matInput id="nombre" name="nombre" placeholder="nombre" [formControl]="nombre">
          </mat-form-field>

          <mat-form-field>
            <input matInput id="uso_principal" name="uso_principal" placeholder="uso_principal" [formControl]="uso_principal">
          </mat-form-field>

          <mat-form-field>
            <input matInput id="pisos" name="pisos" placeholder="pisos" [formControl]="pisos">
          </mat-form-field>

          <mat-form-field>
            <input matInput id="estado" name="estado" placeholder="estado" [formControl]="estado">
          </mat-form-field>

          <mat-form-field>
            <input matInput id="observacion" name="observacion" placeholder="observacion" [formControl]="observacion">
          </mat-form-field>

          <mat-form-field>
            <input matInput id="area" name="area" placeholder="area calculada" [formControl]="area">
          </mat-form-field>

          <mat-form-field>
            <input matInput id="perimetro" name="perimetro" placeholder="perimetro calculado" [formControl]="perimetro">
          </mat-form-field>

          <mat-form-field class="full-width">
            <input matInput id="geom" name="geom" placeholder="POLYGON((0 0, 100 0, 100 100, 0 100, 0 0))" [formControl]="geom">
          </mat-form-field>
        </div>

        <div class="buttons">
          <button mat-raised-button class="btn-primary" color="primary" [disabled]="!controlsGroup.valid" (click)="insert()">Insert</button>
          <button mat-raised-button class="btn-light" (click)="selectOne()">Select one</button>
          <button mat-raised-button class="btn-light" (click)="selectAll()">Select all</button>
          <button mat-raised-button class="btn-warning" color="accent" [disabled]="!controlsGroup.valid" (click)="update()">Update</button>
          <button mat-raised-button class="btn-danger" color="warn" (click)="deleteRow()">Delete</button>
          <button mat-raised-button class="btn-light" (click)="fillCampusData()">Fill Data</button>
          <button mat-button class="btn-clean" (click)="clearForm()">Clean</button>
        </div>
      </form>

      <p class="message" *ngIf="serverMessage">{{ serverMessage }}</p>
    </mat-card-content>
  </mat-card>

  <div class="table-card" *ngIf="rows.length > 0">
    <table class="data-table">
      <tr>
        <th>id</th>
        <th>nombre</th>
        <th>uso</th>
        <th>area</th>
        <th>geom</th>
      </tr>

      <tr *ngFor="let row of rows">
        <td>{{ row.id }}</td>
        <td>{{ row.nombre }}</td>
        <td>{{ row.uso_principal }}</td>
        <td>{{ row.area }}</td>
        <td>{{ row.geom }}</td>
      </tr>
    </table>
  </div>
</section>
